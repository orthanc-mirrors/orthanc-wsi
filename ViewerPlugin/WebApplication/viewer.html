<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Orthanc for Whole-Slide Imaging</title>

    <link rel="stylesheet" href="../libs/css/bootstrap.min.css" type="text/css">
    <link rel="stylesheet" href="../libs/css/ol.css" type="text/css">

    <style>
      html,
      body {
          margin: 0;
          height: 100%;
          overflow: hidden;
      }

      #map {
          position: absolute;
          top: 0;
          bottom: 0;
          width: 100%;
      }

      #toolbar-left { /* the top/left coordinates are adjusted in JavaScript */
          position: absolute;
          z-index: 20;
      }

      #toolbar-left .ol-rotate {
          right: auto;
      }

      #toolbar-top { /* the top/left coordinates are adjusted in JavaScript */
          padding-left: 1em;
          position: absolute;
          z-index: 20;
      }

      .icon-btn { /* the width and height are adjusted in JavaScript */
          display: inline-flex;
          align-items: center;
          justify-content: center;
          padding: 0;
      }

      .btn-outline-secondary {
          background-color: white;  /* make the toolbar buttons opaque */
      }

      #right-panel {
          --bs-offcanvas-width: 300px;
          --bs-offcanvas-border-width: 0;
          /*transition: 0.1s ease-in-out;*/   /* this gives a fast animation */
          /*transition: none;*/   /* this removes the animation */
      }

      #right-panel-toggle {
          position: fixed;
          top: 0;
          bottom: 0;
          z-index: 20;
          border-radius: 4px 0 0 4px;
          border-right: none;
          opacity: 0.75;
          padding: 0px;
      }

      .ol-attribution {
          right: 20px !important;  /* keep the description out of the vertical toggle button */
      }

      /* Bootstrap Icons */
      .bi {
          display: inline-block;
          width: 1em;
          height: 1em;
          background-color: currentColor;
          -webkit-mask-size: 100% 100%;
          mask-size: 100% 100%;
          -webkit-mask-repeat: no-repeat;
          mask-repeat: no-repeat;
      }

      /* The used icons must be added to ../Resources/CMake/JavaScriptLibraries.cmake */
      .bi-arrows                { -webkit-mask-image: url("../libs/svg/arrows.svg"); mask-image: url("../libs/svg/arrows.svg"); }
      .bi-arrows-fullscreen     { -webkit-mask-image: url("../libs/svg/arrows-fullscreen.svg"); mask-image: url("../libs/svg/arrows-fullscreen.svg"); }
      .bi-chevron-compact-left  { -webkit-mask-image: url("../libs/svg/chevron-compact-left.svg"); mask-image: url("../libs/svg/chevron-compact-left.svg"); }
      .bi-chevron-compact-right { -webkit-mask-image: url("../libs/svg/chevron-compact-right.svg"); mask-image: url("../libs/svg/chevron-compact-right.svg"); }
      .bi-circle                { -webkit-mask-image: url("../libs/svg/circle.svg"); mask-image: url("../libs/svg/circle.svg"); }
      .bi-eye                   { -webkit-mask-image: url("../libs/svg/eye.svg"); mask-image: url("../libs/svg/eye.svg"); }
      .bi-eye-slash             { -webkit-mask-image: url("../libs/svg/eye-slash.svg"); mask-image: url("../libs/svg/eye-slash.svg"); }
      .bi-geo-alt               { -webkit-mask-image: url("../libs/svg/geo-alt.svg"); mask-image: url("../libs/svg/geo-alt.svg"); }
      .bi-hand-index            { -webkit-mask-image: url("../libs/svg/hand-index.svg"); mask-image: url("../libs/svg/hand-index.svg"); }
      .bi-pencil                { -webkit-mask-image: url("../libs/svg/pencil.svg"); mask-image: url("../libs/svg/pencil.svg"); }
      .bi-pentagon              { -webkit-mask-image: url("../libs/svg/pentagon.svg"); mask-image: url("../libs/svg/pentagon.svg"); }
      .bi-share                 { -webkit-mask-image: url("../libs/svg/share.svg"); mask-image: url("../libs/svg/share.svg"); }
      .bi-square                { -webkit-mask-image: url("../libs/svg/square.svg"); mask-image: url("../libs/svg/square.svg"); }
      .bi-trash                 { -webkit-mask-image: url("../libs/svg/trash.svg"); mask-image: url("../libs/svg/trash.svg"); }
    </style>

  </head>
  <body>
    <div id="map">
      <div id="toolbar-top" style="visibility:hidden">
        <div class="btn-group" role="group">
          <button type="button" class="btn btn-outline-secondary icon-btn" id="btn-select-annotation"
                  data-bs-toggle="tooltip" data-bs-placement="bottom" title="Select annotation">
            <i class="bi bi-hand-index"></i>
          </button>

          <button type="button" class="btn btn-outline-secondary icon-btn" id="btn-draw-line"
                  data-bs-toggle="tooltip" data-bs-placement="bottom" title="Draw line">
            <i class="bi bi-arrows"></i>
          </button>

          <button type="button" class="btn btn-outline-secondary icon-btn" id="btn-draw-point"
                  data-bs-toggle="tooltip" data-bs-placement="bottom" title="Draw point">
            <i class="bi bi-geo-alt"></i>
          </button>

          <button type="button" class="btn btn-outline-secondary icon-btn" id="btn-draw-circle"
                  data-bs-toggle="tooltip" data-bs-placement="bottom" title="Draw circle">
            <i class="bi bi-circle"></i>
          </button>

          <button type="button" class="btn btn-outline-secondary icon-btn" id="btn-draw-rectangle"
                  data-bs-toggle="tooltip" data-bs-placement="bottom" title="Draw rectangle">
            <i class="bi bi-square"></i>
          </button>

          <button type="button" class="btn btn-outline-secondary icon-btn" id="btn-draw-closed-polygon"
                  data-bs-toggle="tooltip" data-bs-placement="bottom" title="Draw closed polygon">
            <i class="bi bi-pentagon"></i>
          </button>

          <button type="button" class="btn btn-outline-secondary icon-btn" id="btn-draw-freehand"
                  data-bs-toggle="tooltip" data-bs-placement="bottom" title="Draw freehand figure">
            <i class="bi bi-pencil"></i>
          </button>
        </div>

        <div class="btn-group" role="group">
          <button type="button" class="btn btn-outline-secondary icon-btn" id="btn-delete-annotation"
                  data-bs-toggle="tooltip" data-bs-placement="bottom" title="Delete selected annotation">
            <i class="bi bi-trash"></i>
          </button>
        </div>

        <div class="alert alert-danger alert-dismissible d-inline-block py-0 d-none" role="alert" id="alert-no-saving">
          Your annotations will not be saved
          <button type="button" class="btn-close top-50 translate-middle-y" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      </div>

      <div id="toolbar-left" style="visibility:hidden">
        <div id="toolbar-left-content" style="position:absolute; display:flex; flex-direction:column; align-items:center;">
          <div class="btn-group-vertical" role="group" style="padding-top: 1em">
            <button type="button" class="btn btn-outline-secondary icon-btn"
                    data-bs-toggle="tooltip" data-bs-placement="right" title="Action A">
              a
            </button>

            <button type="button" class="btn btn-outline-secondary icon-btn"
                    data-bs-toggle="tooltip" data-bs-placement="right" title="Action B">
              b
            </button>

            <button type="button" class="btn btn-outline-secondary icon-btn"
                    data-bs-toggle="tooltip" data-bs-placement="right" title="Action C">
              c
            </button>

            <button type="button" class="btn btn-outline-secondary icon-btn"
                    data-bs-toggle="tooltip" data-bs-placement="right" title="Action D">
              d
            </button>
          </div>
          <div id="toolbar-spinner" style="display:none; padding-top:1em;">
            <div class="spinner-border spinner-border-sm text-secondary" role="status">
              <span class="visually-hidden">Saving...</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="offcanvas offcanvas-end" data-bs-backdrop="false" data-bs-scroll="true"
         tabindex="-1" id="right-panel">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title">Annotations</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
      </div>
      <div class="offcanvas-body p-2">
        <div id="annotation-info" style="display:none" class="mb-3">
          <h5>Current selection</h5>
          <button class="btn btn-sm btn-primary w-100 mb-2" id="btn-focus-annotation">
            <i class="bi bi-arrows-fullscreen me-2 align-middle"></i> Focus on annotation
          </button>
          <div id="annotation-properties"></div>
        </div>

        <div class="d-flex align-items-center mb-1">
          <h5>Layers</h5>
          <button type="button" class="btn btn-primary ms-auto"
                  id="btn-add-layer">+</button>
        </div>
        <table class="table table-sm table-borderless mb-0 align-middle">
          <thead class="small text-muted">
            <tr>
              <th class="p-0 text-center fw-normal" title="Editing layer">E</th>
              <th class="p-0 text-center fw-normal" title="Visible">V</th>
              <th class="p-0 text-center fw-normal" title="Color">C</th>
              <th class="px-1 py-0 fw-normal">Name</th>
              <th class="p-0 text-center fw-normal" title="Sharing (coming soon)">S</th>
              <th class="p-0"></th>
            </tr>
          </thead>
          <tbody id="layers-tbody"></tbody>
        </table>
      </div>
    </div>

    <button id="right-panel-toggle" type="button" class="btn btn-secondary" style="visibility:hidden"
            data-bs-toggle="offcanvas" data-bs-target="#right-panel">
      <i class="bi bi-chevron-compact-left" id="right-panel-toggle-icon"></i>
    </button>

    <!-- Confirmation modal for annotation deletion -->
    <div class="modal fade" id="modal-delete-annotation" tabindex="-1">
      <div class="modal-dialog modal-sm">
        <div class="modal-content">
          <div class="modal-body">
            Delete this annotation?
          </div>
          <div class="modal-footer py-1">
            <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-sm btn-danger" id="btn-delete-annotation-confirm">Delete</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Confirmation modal for layer deletion -->
    <div class="modal fade" id="modal-delete-layer" tabindex="-1">
      <div class="modal-dialog modal-sm">
        <div class="modal-content">
          <div class="modal-body">
            Delete this layer and all its annotations?
          </div>
          <div class="modal-footer py-1">
            <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-sm btn-danger" id="btn-delete-layer-confirm">Delete</button>
          </div>
        </div>
      </div>
    </div>

    <div style="display:none">
      <div id="popover-content">
        <div class="container">
          <div class="row mb-2">
            <div class="btn-group btn-group-sm" role="group">
              <button type="button" class="btn btn-outline-dark" id="rotation-reset">Reset</button>
              <button type="button" class="btn btn-outline-dark" id="rotation-plus90">+90&deg;</button>
              <button type="button" class="btn btn-outline-dark" id="rotation-minus90">-90&deg;</button>
            </div>
          </div>
          <div class="row">
            <input type="range" class="form-range" min="-180" max="180" id="rotation-slider">
          </div>
        </div>
      </div>
    </div>

    <template id="tpl-readonly-property">
      <div class="d-flex align-items-baseline border-bottom py-1 gap-2">
        <span class="text-muted small flex-shrink-0 prop-label" style="width:8em"></span>
        <span class="text-break small prop-value"></span>
      </div>
    </template>

    <template id="tpl-editable-property">
      <div class="d-flex align-items-center border-bottom py-1 gap-2">
        <label class="text-muted small flex-shrink-0 mb-0" style="width:8em"></label>
        <input type="text" class="form-control form-control-sm small flex-grow-1">
      </div>
    </template>

    <template id="tpl-dropdown-property">
      <div class="d-flex align-items-center border-bottom py-1 gap-2">
        <label class="text-muted small flex-shrink-0 mb-0" style="width:8em"></label>
        <select class="form-select form-select-sm small flex-grow-1"></select>
      </div>
    </template>

    <template id="tpl-layer-row">
      <tr>
        <td class="text-center align-middle p-0">
          <input type="radio" class="form-check-input m-0 layer-radio" name="active-layer">
        </td>
        <td class="text-center align-middle p-0">
          <button type="button" class="btn btn-link p-1 layer-vis-btn" style="color:inherit">
            <i class="layer-eye-icon align-middle"></i>
          </button>
        </td>
        <td class="text-center align-middle p-0">
          <input type="color" class="layer-color" style="width:22px;height:22px;padding:1px;border:none;cursor:pointer;border-radius:3px">
        </td>
        <td class="align-middle px-1 py-0">
          <input type="text" class="form-control form-control-sm py-0 layer-name">
        </td>
        <td class="text-center align-middle p-0">
          <i class="bi bi-share p-1" style="opacity:0.25"></i>
        </td>
        <td class="text-center align-middle p-0">
          <button type="button" class="btn btn-link p-0 text-danger layer-del-btn">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
    </template>

    <!-- This is the version of jQuery that is used by Orthanc Explorer -->
    <script src="../../app/libs/jquery.min.js"></script>

    <script src="../libs/js/popper.min.js"></script>
    <script src="../libs/js/bootstrap.min.js"></script>
    <script src="../libs/js/ol.js"></script>
    <script src="viewer.js"></script>
    <script src="annotations.js"></script>
  </body>
</html>
