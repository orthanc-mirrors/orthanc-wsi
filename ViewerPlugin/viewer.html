<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Orthanc for Whole-Slide Imaging</title>

    <link rel="stylesheet" href="../libs/css/bootstrap.min.css" type="text/css">
    <link rel="stylesheet" href="../libs/css/ol.css" type="text/css">

    <style>
      html,
      body {
          margin: 0;
          height: 100%;
          overflow: hidden;
      }

      #map {
          position: absolute;
          top: 0;
          bottom: 0;
          width: 100%;
      }

      #toolbar-left { /* the top/left coordinates are adjusted in JavaScript */
          padding-top: 1em;
          position: absolute;
          z-index: 20;
      }

      #toolbar-left .ol-rotate {
          right: auto;
      }

      #toolbar-top { /* the top/left coordinates are adjusted in JavaScript */
          padding-left: 1em;
          position: absolute;
          z-index: 20;
      }

      .icon-btn { /* the width and height are adjusted in JavaScript */
          display: inline-flex;
          align-items: center;
          justify-content: center;
          padding: 0;
      }

      .btn-outline-secondary {
          background-color: white;  /* make the toolbar buttons opaque */
      }

      #right-panel {
          --bs-offcanvas-width: 300px;
          --bs-offcanvas-border-width: 0;
          /*transition: 0.1s ease-in-out;*/   /* this gives a fast animation */
          /*transition: none;*/   /* this removes the animation */
      }

      #right-panel-toggle {
          position: fixed;
          top: 0;
          bottom: 0;
          z-index: 20;
          border-radius: 4px 0 0 4px;
          border-right: none;
          opacity: 0.75;
          padding: 6px;
      }

      .ol-attribution {
          right: 20px !important;  /* keep the description out of the vertical toggle button */
      }

      /* Define some icons using Unicode, instead of adding a dependency on a third-party library such as FontAwesome */
      i[class^="icon-"] { font-style: normal; }
      i.icon-chevron-left::before   { content: '\2039'; } /* < */
      i.icon-chevron-right::before  { content: '\203A'; } /* > */
      i.icon-line::before           { content: '\2014'; } /* dash */
      i.icon-point::before          { content: '\25CF'; } /* black circle */
      i.icon-select::before         { content: '\2196\FE0E'; } /* north-west arrow (text variant, not emoji) */
    </style>

  </head>
  <body>
    <div id="map">
      <div id="toolbar-top">
        <div class="btn-group" role="group">
          <button type="button" class="btn btn-outline-secondary icon-btn" id="btn-select-annotation">
            <i class="icon-select"></i>
          </button>

          <button type="button" class="btn btn-outline-secondary icon-btn" id="btn-draw-line">
            <i class="icon-line"></i>
          </button>

          <button type="button" class="btn btn-outline-secondary icon-btn" id="btn-draw-point">
            <i class="icon-point"></i>
          </button>

          <button type="button" class="btn btn-outline-secondary icon-btn">
            d
          </button>
        </div>
      </div>

      <div id="toolbar-left">
        <div class="btn-group-vertical" role="group" id="toolbar-left-buttons" style="padding-bottom: 1em">
          <button type="button" class="btn btn-outline-secondary icon-btn">
            a
          </button>

          <button type="button" class="btn btn-outline-secondary icon-btn">
            b
          </button>

          <button type="button" class="btn btn-outline-secondary icon-btn">
            c
          </button>

          <button type="button" class="btn btn-outline-secondary icon-btn">
            d
          </button>
        </div>
      </div>
    </div>

    <div class="offcanvas offcanvas-end" data-bs-backdrop="false" data-bs-scroll="true"
         tabindex="-1" id="right-panel">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title">Panel</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
      </div>
      <div class="offcanvas-body">
        <!-- Panel content here -->
      </div>
    </div>

    <button id="right-panel-toggle" type="button" class="btn btn-secondary"
            data-bs-toggle="offcanvas" data-bs-target="#right-panel">
      <i class="icon-chevron-left" id="right-panel-toggle-icon"></i>
    </button>

    <div id="annotation-tooltip" class="badge bg-dark text-white"
         style="position: fixed; display: none; pointer-events: none;"></div>

    <div style="display:none">
      <div id="popover-content">
        <div class="container">
          <div class="row mb-2">
            <div class="btn-group btn-group-sm" role="group">
              <button type="button" class="btn btn-outline-dark" id="rotation-reset">Reset</button>
              <button type="button" class="btn btn-outline-dark" id="rotation-plus90">+90&deg;</button>
              <button type="button" class="btn btn-outline-dark" id="rotation-minus90">-90&deg;</button>
            </div>
          </div>
          <div class="row">
            <input type="range" class="form-range" min="-180" max="180" id="rotation-slider">
          </div>
        </div>
      </div>
    </div>

    <!-- This is the version of jQuery that is used by Orthanc Explorer -->
    <script src="../../app/libs/jquery.min.js"></script>

    <script src="../libs/js/popper.min.js"></script>
    <script src="../libs/js/bootstrap.min.js"></script>
    <script src="../libs/js/ol.js"></script>
    <script src="viewer.js"></script>
  </body>
</html>
